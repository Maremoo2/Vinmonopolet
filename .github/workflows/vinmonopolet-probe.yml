name: Test Vinmonopolet Open API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test two catalogue pages
        env:
          VINMONOPOLET_API_KEY: ${{ secrets.PRODUCTS_0 }}
        run: python3 wine_intelligence.py probe
